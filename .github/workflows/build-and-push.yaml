name: Build Go Welcome App and Push Docker image
on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
  pull_request:

permissions:
  contents: write
  packages: write
  pull-requests: write
  security-events: write

env:
  GO_VERSION: 1.26
  APP_NAME: go-welcome-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Dependencies
        run: go mod download

      - name: Verify Dependencies
        run: go mod verify

      - name: Lint ${{ env.APP_NAME }}
        run: go vet ./...

      - name: Build Go binary
        run: |
          go mod tidy
          go build -o ${{ env.APP_NAME }}

      - name: Extract Short SHA
        id: extract_sha
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true # Loads image into local Docker runtime for scanning
          tags: |
            sahilwork/${{ env.APP_NAME }}:latest
            sahilwork/${{ env.APP_NAME }}:${{ env.SHORT_SHA }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "sahilwork/${{ env.APP_NAME }}:${{ env.SHORT_SHA }}"
          format: "table"
          exit-code: "1" # Fail the pipeline if vulnerabilities are found (change to '0' if you only want reports without failing)
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            sahilwork/${{ env.APP_NAME }}:latest
            sahilwork/${{ env.APP_NAME }}:${{ env.SHORT_SHA }}
