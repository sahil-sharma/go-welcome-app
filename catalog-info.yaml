apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: go-welcome-app
  description: Welcome service in Go
  tags: [go]
  annotations:
    github.com/project-slug: sahil-sharma/go-welcome-app
    argocd/app-name: go-welcome-app
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=go-welcome-app
    backstage.io/kubernetes-namespace: go-welcome-app
    vault.io/secrets-path: go-welcome-app
    backstage.io/techdocs-ref: dir:.
  links:
    - title: Open app
      url: https://welcome.local.io
      icon: dashboard
    - title: Argo CD
      url: https://cd.local.io/applications/go-welcome-app
      icon: dashboard
    - title: CI (GitHub Actions)
      url: https://github.com/sahil-sharma/go-welcome-app/actions
      icon: github
    - title: Deployment manifests
      url: https://github.com/sahil-sharma/k8s-stuff/tree/main/apps/go-welcome-app
      icon: github
    - title: Secrets (Vault)
      url: https://secrets.local.io/ui/vault/secrets-engines/apps/kv/list/go-welcome-app
      icon: dashboard
    - title: Grafana dashboard
      url: https://dashboards.local.io/d/service-overview?var-namespace=go-welcome-app
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: group:default/go-app-team
  system: idp-demo
  providesApis:
    - go-welcome-api
  consumesApis:
    - adviceslip-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: go-welcome-api
  title: Go Welcome API
  description: OpenAPI spec for the go-welcome-app HTTP endpoints (/welcome, /external).
spec:
  type: openapi
  lifecycle: production
  owner: group:default/go-app-team
  system: idp-demo
  definition: |
    openapi: 3.0.3
    info:
      title: Go Welcome API
      version: 1.0.0
      description: Endpoints provided by go-welcome-app
    servers:
      - url: https://welcome.local.io
        description: Local Ingress / Application Endpoint
    paths:
      /:
        get:
          summary: Simple hello endpoint
          responses:
            '200':
              description: OK
      /welcome:
        get:
          summary: Returns hostname, container user, timestamp, and APP_USERNAME and APP_PASSWORD environment variables
          responses:
            '200':
              description: OK
      /external:
        get:
          summary: Fetches random advice from Advice Slip API
          responses:
            '200':
              description: OK
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: adviceslip-api
  title: Advice Slip JSON API
  description: External public API providing random advice slips consumed by go-welcome-app /external.
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/go-app-team
  system: idp-demo
  definition: |
    openapi: 3.0.3
    info:
      title: Advice Slip API
      version: 1.0.0
    servers:
      - url: https://api.adviceslip.com
    paths:
      /advice:
        get:
          summary: Get random advice
          responses:
            '200':
              description: Successful response containing advice JSON
