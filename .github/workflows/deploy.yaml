name: GitOps Deploy - Raise PR for Go Welcome App Image Update

on:
  workflow_run:
    workflows: ["Build Go Welcome App and Push Docker image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag / Short SHA to deploy (e.g., 23762ef or latest). Leave blank if triggered via workflow_run."
        required: false
        type: string

jobs:
  raise-pr:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target K8s Repository
        uses: actions/checkout@v7
        with:
          repository: sahil-sharma/k8s-stuff
          token: ${{ secrets.PAT_FOR_K8S_REPO }}
          path: helm-repo

      - name: Determine Target Short SHA
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Use manual input if provided, otherwise default to 'latest'
            INPUT_TAG="${{ github.event.inputs.image_tag }}"
            if [ -z "$INPUT_TAG" ]; then
              SHORT_SHA="latest"
            else
              SHORT_SHA="$INPUT_TAG"
            fi
            echo "Triggered manually with tag/SHA: $SHORT_SHA"
          else
            # Automatically grab the first 7 chars of the commit that successfully built the image
            FULL_SHA="${{ github.event.workflow_run.head_sha }}"
            SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)
            echo "Triggered automatically by build run. Full SHA: $FULL_SHA -> Short: $SHORT_SHA"
          fi

          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Update Deployment Image Tag
        run: |
          cd helm-repo
          BRANCH_NAME="update-go-welcome-app-${{ env.SHORT_SHA }}"
          git checkout -b "$BRANCH_NAME"

          # Target file path: apps/go-welcome-app/deployment.yaml
          MANIFEST_PATH="./apps/go-welcome-app/deployment.yaml"

          # Safely update the image tag while preserving the container/registry prefix
          sed -i 's|\(image: .*/go-welcome-app:\)[^ ]*|\1'"${{ env.SHORT_SHA }}"'|' "$MANIFEST_PATH"

          # Verify change was applied
          grep 'image:' "$MANIFEST_PATH"

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add "$MANIFEST_PATH"

          # Commit and push only if there are actual diff changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(deps): update go-welcome-app image tag to ${{ env.SHORT_SHA }}" && git push origin "$BRANCH_NAME")

      - name: Create Pull Request
        run: |
          cd helm-repo
          BRANCH_NAME="update-go-welcome-app-${{ env.SHORT_SHA }}"

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(deps): update go-welcome-app image tag to ${{ env.SHORT_SHA }}" \
            --body "Automated PR updating the \`go-welcome-app\` image tag in \`apps/go-welcome-app/deployment.yaml\` to tag/commit \`${{ env.SHORT_SHA }}\`."
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_K8S_REPO }}
