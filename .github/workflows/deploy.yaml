name: GitOps Deploy - Raise PR for Go Welcome App Image Update

on:
  workflow_run:
    workflows: ["Build Go Welcome App and Push Docker image"]
    types:
      - completed
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  raise-pr:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target K8s Repository
        uses: actions/checkout@v7
        with:
          repository: sahil-sharma/k8s-stuff
          token: ${{ secrets.PAT_FOR_K8S_REPO }}
          path: helm-repo

      - name: Extract and Export Short SHA
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            FULL_SHA="${{ github.sha }}"
          else
            FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          SHORT_SHA=$(echo "$FULL_SHA" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "Triggered via ${{ github.event_name }} - Full SHA: $FULL_SHA -> Short SHA: $SHORT_SHA"

      - name: Update Deployment Image Tag
        run: |
          cd helm-repo
          BRANCH_NAME="update-go-welcome-app-${{ env.SHORT_SHA }}"
          git checkout -b "$BRANCH_NAME"

          # Target file path: apps/go-welcome-app/deployment.yaml
          MANIFEST_PATH="./apps/go-welcome-app/deployment.yaml"

          # Safely update the image tag while preserving the container/registry prefix
          sed -i 's|\(image: .*/go-welcome-app:\)[^ ]*|\1'"${{ env.env.SHORT_SHA || env.SHORT_SHA }}"'|' "$MANIFEST_PATH"

          # Verify change was applied
          grep 'image:' "$MANIFEST_PATH"

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add "$MANIFEST_PATH"

          # Commit and push only if there are actual diff changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(deps): update go-welcome-app image tag to ${{ env.SHORT_SHA }}" && git push origin "$BRANCH_NAME")

      - name: Create Pull Request
        run: |
          cd helm-repo
          BRANCH_NAME="update-go-welcome-app-${{ env.SHORT_SHA }}"

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(deps): update go-welcome-app image tag to ${{ env.SHORT_SHA }}" \
            --body "Automated PR updating the \`go-welcome-app\` image tag in \`apps/go-welcome-app/deployment.yaml\` to commit \`${{ env.SHORT_SHA }}\`."
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_K8S_REPO }}
